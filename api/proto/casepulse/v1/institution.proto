syntax = "proto3";

package casepulse.v1;

option go_package = "github.com/mkkim-gr8/casepulse/gen/go/casepulse/v1;casepulsev1";

// InstitutionType은 법률 업무에 사용되는 기관의 유형을 나타냅니다.
enum InstitutionType {
  // 기관 유형이 지정되지 않았습니다.
  INSTITUTION_TYPE_UNSPECIFIED = 0;
  // 법원을 나타냅니다.
  INSTITUTION_TYPE_COURT = 1;
  // 검찰 기관을 나타냅니다.
  INSTITUTION_TYPE_PROSECUTION = 2;
  // 경찰 기관을 나타냅니다.
  INSTITUTION_TYPE_POLICE = 3;
  // 등기소를 나타냅니다.
  INSTITUTION_TYPE_REGISTRY = 4;
}

// CourtLevel은 법원의 조직상 단계를 나타냅니다.
enum CourtLevel {
  // 법원 단계가 지정되지 않았습니다.
  COURT_LEVEL_UNSPECIFIED = 0;
  // 대법원급 법원입니다.
  COURT_LEVEL_SUPREME = 1;
  // 고등법원급 법원입니다.
  COURT_LEVEL_HIGH = 2;
  // 지방법원급 법원입니다.
  COURT_LEVEL_DISTRICT = 3;
  // 시·군법원 등 지역 법원입니다.
  COURT_LEVEL_LOCAL = 4;
}

// CourtType은 법원의 관할 분야를 나타냅니다.
enum CourtType {
  // 법원 유형이 지정되지 않았습니다.
  COURT_TYPE_UNSPECIFIED = 0;
  // 일반 법원입니다.
  COURT_TYPE_GENERAL = 1;
  // 가정법원입니다.
  COURT_TYPE_FAMILY = 2;
  // 행정법원입니다.
  COURT_TYPE_ADMINISTRATIVE = 3;
  // 특허법원입니다.
  COURT_TYPE_PATENT = 4;
  // 회생법원입니다.
  COURT_TYPE_REHABILITATION = 5;
}

// CourtUnitType은 본원, 지원 또는 시·군법원 여부를 나타냅니다.
enum CourtUnitType {
  // 법원 조직 유형이 지정되지 않았습니다.
  COURT_UNIT_TYPE_UNSPECIFIED = 0;
  // 본원입니다.
  COURT_UNIT_TYPE_MAIN = 1;
  // 지원입니다.
  COURT_UNIT_TYPE_SUPPORT = 2;
  // 시·군법원입니다.
  COURT_UNIT_TYPE_MUNICIPAL_COUNTY = 3;
}

// CourtPanelType은 재판부가 법원 소재지 안에 있는지 원외에 있는지 나타냅니다.
enum CourtPanelType {
  // 재판부 유형이 지정되지 않았습니다.
  COURT_PANEL_TYPE_UNSPECIFIED = 0;
  // 법원 소재지에 있는 재판부입니다.
  COURT_PANEL_TYPE_AT_SEAT = 1;
  // 법원 소재지 밖에서 운영되는 원외 재판부입니다.
  COURT_PANEL_TYPE_OUT_OF_SEAT = 2;
}

// Institution은 법률 기관의 연락처 정보를 담습니다.
message Institution {
  // id는 기관의 고유 식별자입니다.
  string id = 1;
  // name은 기관의 표시 이름입니다.
  string name = 2;
  // type은 기관의 유형입니다.
  InstitutionType type = 3;
  // address는 기관의 주소입니다.
  string address = 4;
  // phone은 기관의 연락처 전화번호입니다.
  string phone = 5;
  // email은 기관의 연락처 이메일 주소입니다.
  string email = 6;
  // court는 기관이 법원인 경우의 상세정보입니다.
  CourtDetails court = 7;
}

// CourtPanel은 법원에 소속된 재판부와 소재지를 나타냅니다.
message CourtPanel {
  // id는 재판부의 고유 식별자입니다.
  string id = 1;
  // name은 재판부 구성표에 기재된 이름입니다.
  string name = 2;
  // type은 법원 소재지 안의 재판부인지 원외 재판부인지 나타냅니다.
  CourtPanelType type = 3;
  // seat은 재판부의 소재지입니다.
  string seat = 4;
  // panels는 이 재판부에 소속된 하위 재판부 목록입니다.
  repeated CourtPanel panels = 5;
}

// CourtDetails는 법원 분류와 소재지 및 관할 정보를 담습니다.
message CourtDetails {
  // level은 법원의 조직상 단계입니다.
  CourtLevel level = 1;
  // type은 법원의 관할 분야입니다.
  CourtType type = 2;
  // unit_type은 본원, 지원 또는 시·군법원 여부입니다.
  CourtUnitType unit_type = 3;
  // parent_court_id는 소속 본원의 기관 ID입니다. 본원에는 지정하지 않습니다.
  string parent_court_id = 4;
  // seat은 법률상 법원 소재지입니다.
  string seat = 5;
  // jurisdictions는 법원의 관할 지역입니다.
  repeated string jurisdictions = 6;
  // panels는 법원에 소속된 재판부 목록입니다.
  repeated CourtPanel panels = 7;
}

// GetInstitutionRequest는 조회할 기관을 지정합니다.
message GetInstitutionRequest {
  // id는 기관의 고유 식별자입니다.
  string id = 1;
}

// GetInstitutionResponse는 조회한 기관 정보를 담습니다.
message GetInstitutionResponse {
  // institution은 조회된 기관입니다.
  Institution institution = 1;
}

// ListInstitutionsRequest는 기관 목록의 필터와 페이지 정보를 지정합니다.
message ListInstitutionsRequest {
  // type은 조회할 기관 유형입니다. 지정하지 않으면 모든 유형을 조회합니다.
  InstitutionType type = 1;
  // page_size는 한 번에 반환할 최대 결과 수입니다.
  int32 page_size = 2;
  // page_token은 이전 목록 조회의 다음 페이지를 요청하는 토큰입니다.
  string page_token = 3;
}

// ListInstitutionsResponse는 기관 목록의 한 페이지를 담습니다.
message ListInstitutionsResponse {
  // institutions는 현재 페이지의 조회 결과입니다.
  repeated Institution institutions = 1;
  // next_page_token은 다음 페이지가 없으면 비어 있습니다.
  string next_page_token = 2;
}

// InstitutionService는 법률 기관 정보 조회 기능을 제공합니다.
service InstitutionService {
  // GetInstitution은 고유 식별자로 기관 정보를 조회합니다.
  rpc GetInstitution(GetInstitutionRequest) returns (GetInstitutionResponse);
  // ListInstitutions는 필터 조건에 맞는 기관 목록을 페이지 단위로 조회합니다.
  rpc ListInstitutions(ListInstitutionsRequest) returns (ListInstitutionsResponse);
}
