x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 3
  start_period: 30s
  start_interval: 1s

services:
  leviathan:
    build:
      context: .
      dockerfile: cmd/leviathan/Dockerfile
    expose:
      - "9090"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/leviathan", "-healthcheck"]

  clio:
    build:
      context: .
      dockerfile: cmd/clio/Dockerfile
    environment:
      LEVIATHAN_GRPC_ADDR: leviathan:9090
    depends_on:
      leviathan:
        condition: service_healthy
    expose:
      - "9091"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/clio", "-healthcheck"]

  aegis:
    build:
      context: .
      dockerfile: cmd/aegis/Dockerfile
    environment:
      LEVIATHAN_GRPC_ADDR: leviathan:9090
      CLIO_GRPC_ADDR: clio:9091
    depends_on:
      clio:
        condition: service_healthy
      leviathan:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/aegis", "-healthcheck"]
