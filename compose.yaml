x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 3
  start_period: 30s
  start_interval: 1s

services:
  # 개발용 PostgreSQL입니다. Clio가 사건 저장소로 사용합니다.
  postgres:
    image: postgres:19-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-casepulse}
      POSTGRES_USER: ${POSTGRES_USER:-casepulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-casepulse}
    ports:
      # 개발 도구(psql, DB 클라이언트)에서 접속할 수 있도록 이 컴퓨터에만 공개합니다.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18부터 데이터 디렉터리가 메이저 버전별 하위 폴더로 바뀌어 상위 폴더를 마운트합니다.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]

  leviathan:
    build:
      context: .
      dockerfile: cmd/leviathan/Dockerfile
    expose:
      - "9090"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/leviathan", "-healthcheck"]

  clio:
    build:
      context: .
      dockerfile: cmd/clio/Dockerfile
    environment:
      LEVIATHAN_GRPC_ADDR: leviathan:9090
      DATABASE_URL: postgres://${POSTGRES_USER:-casepulse}:${POSTGRES_PASSWORD:-casepulse}@postgres:5432/${POSTGRES_DB:-casepulse}?sslmode=disable
    depends_on:
      leviathan:
        condition: service_healthy
      postgres:
        condition: service_healthy
    expose:
      - "9091"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/clio", "-healthcheck"]

  aegis:
    build:
      context: .
      dockerfile: cmd/aegis/Dockerfile
    environment:
      LEVIATHAN_GRPC_ADDR: leviathan:9090
      CLIO_GRPC_ADDR: clio:9091
    depends_on:
      clio:
        condition: service_healthy
      leviathan:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/aegis", "-healthcheck"]

volumes:
  postgres-data:
